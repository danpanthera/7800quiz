name: mobile_7800quiz
description: 7800Quiz — Ứng dụng thi nội bộ ngân hàng (offline-first)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.0.0

  # Local database (offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # HTTP & Connectivity
  dio: ^5.4.0
  connectivity_plus: ^6.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Auth & Storage
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.3.0

  # UUID for idempotent submissions
  uuid: ^4.4.0

  # Real-time (Arena mode)
  socket_io_client: ^2.0.3+1

  # Push Notifications (Firebase Cloud Messaging)
  # Yêu cầu setup: google-services.json (Android) + GoogleService-Info.plist (iOS)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # UI
  cupertino_icons: ^1.0.6
  confetti: ^0.7.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/badges/

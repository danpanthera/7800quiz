<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Đặt data-theme (sáng/tối) TRƯỚC khi trình duyệt vẽ trang — tránh nháy sai
         giao diện lúc tải (đọc lựa chọn đã lưu, mặc định theo hệ điều hành nếu
         chưa từng chọn). Đồng bộ logic với ThemeProvider (src/lib/theme.tsx). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme-choice')
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F4EC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="7800Quiz" />
    <title>7800Quiz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
